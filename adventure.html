<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポケモンアドベンチャー</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Dexie (IndexedDB) -->
    <script src="https://unpkg.com/dexie@3/dist/dexie.js"></script>
    <!-- CSS -->
    <link rel="stylesheet" href="css/styles.css">
    <!-- データファイル -->
    <script src="data/pokemon.js"></script>
    <script src="data/moves.js"></script>
    <script src="data/mega_pokemon.js"></script>
    <script src="data/towns.js"></script>
    <script src="data/items.js"></script>
    <script src="data/trainers.js"></script>
    <script src="data/maps.js"></script>
    <!-- マップレンダラー -->
    <script src="components/map-renderer.js"></script>
    <!-- エフェクト -->
    <script src="effects/electric.js"></script>
    <script src="effects/water.js"></script>
    <script src="effects/fire.js"></script>
    <script src="effects/grass.js"></script>
    <script src="effects/ground.js"></script>
    <script src="effects/normal.js"></script>
    <script src="effects/ghost.js"></script>
    <script src="effects/effects-full.js"></script>
    <script src="effects/effects.js"></script>
    <!-- DB -->
    <script src="db/database.js"></script>
    <script src="db/repository.js"></script>
    <!-- Engine -->
    <script src="engine/battle-engine.js"></script>
    <script src="engine/state-machine.js"></script>
    <script src="engine/leveling.js"></script>
    <script src="engine/encounter.js"></script>
    <script src="engine/catching.js"></script>
</head>

<body class="min-h-screen flex items-center justify-center p-2 md:p-4">
    <div id="root" class="w-full max-w-2xl"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;
        const Repo = window.Game.Repository;
        const Leveling = window.Game.Leveling;
        const Encounter = window.Game.Encounter;
        const Catching = window.Game.Catching;
        const TrainerSprites = window.Game.Data.TrainerSprites;
        const LeaderSprites = window.Game.Data.LeaderSprites;
        const BattleEngine = window.Game.BattleEngine;
        const Towns = window.Game.Data.Towns;
        const Routes = window.Game.Data.Routes;
        const Items = window.Game.Data.Items;
        const GymLeaders = window.Game.Data.GymLeaders;
        const Trainers = window.Game.Data.Trainers;
        const EliteFour = window.Game.Data.EliteFour;
        const Champion = window.Game.Data.Champion;
        const NPCs = window.Game.Data.NPCs;
        const ShopInventory = window.Game.Data.ShopInventory;

        // タイプを日本語に変換
        const TYPE_NAME_JP = {
            electric: 'でんき', water: 'みず', fire: 'ほのお', bug: 'むし',
            flying: 'ひこう', steel: 'はがね', dragon: 'ドラゴン',
            fighting: 'かくとう', ghost: 'ゴースト', psychic: 'エスパー',
            poison: 'どく', normal: 'ノーマル', ground: 'じめん', grass: 'くさ'
        };

        // ポケモン画像URL取得
        const getPokemonImageUrl = (masterId) => {
            const data = POKEMON_DATA[masterId];
            if (!data) return '';
            if (masterId === 'black_rayquaza') return 'https://img.pokemondb.net/sprites/black-white/shiny/rayquaza.png';
            const megaUrl = typeof getMegaPokemonImageUrl === 'function' ? getMegaPokemonImageUrl(masterId, null) : null;
            if (megaUrl) return megaUrl;
            return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${data.id}.png`;
        };

        // ===== ダイアログボックス =====
        const DialogBox = ({ text, onComplete, autoAdvance }) => {
            const [displayedText, setDisplayedText] = useState('');
            const [charIndex, setCharIndex] = useState(0);
            const [isComplete, setIsComplete] = useState(false);

            useEffect(() => {
                setDisplayedText('');
                setCharIndex(0);
                setIsComplete(false);
            }, [text]);

            useEffect(() => {
                if (charIndex < text.length) {
                    const timer = setTimeout(() => {
                        setDisplayedText(prev => prev + text[charIndex]);
                        setCharIndex(prev => prev + 1);
                    }, 40);
                    return () => clearTimeout(timer);
                } else {
                    setIsComplete(true);
                    if (autoAdvance && onComplete) {
                        const timer = setTimeout(onComplete, 1500);
                        return () => clearTimeout(timer);
                    }
                }
            }, [charIndex, text]);

            return (
                <div className="dialog-box text-white font-pixel text-lg cursor-pointer"
                     onClick={() => isComplete && onComplete?.()}>
                    {displayedText}
                    {isComplete && !autoAdvance && <span className="ml-2 animate-pulse text-yellow-400">▼</span>}
                </div>
            );
        };

        // ===== タイトル画面 =====
        const TitleScreen = ({ onNewGame, onContinue, hasSaveData }) => (
            <div className="bg-slate-800 rounded-3xl border-4 border-slate-700 shadow-2xl text-white font-pixel p-8 flex flex-col items-center gap-6">
                <h1 className="text-3xl md:text-4xl text-center text-yellow-400 drop-shadow-md">ポケモンアドベンチャー</h1>
                <p className="text-slate-400 text-sm text-center">まちを めぐり ポケモンを つかまえて<br/>チャンピオンを めざそう！</p>
                <div className="flex flex-col gap-4 w-full max-w-xs">
                    <button onClick={onNewGame}
                        className="bg-blue-600 hover:bg-blue-500 text-white px-8 py-5 rounded-2xl font-bold text-xl transition-all border-4 border-blue-400 hover:border-yellow-400 shadow-lg active:translate-y-1">
                        はじめから
                        <div className="text-xs text-blue-200 mt-1">���たらしい ぼうけん</div>
                    </button>
                    {hasSaveData && (
                        <button onClick={onContinue}
                            className="bg-green-600 hover:bg-green-500 text-white px-8 py-5 rounded-2xl font-bold text-xl transition-all border-4 border-green-400 hover:border-yellow-400 shadow-lg active:translate-y-1">
                            つづきから
                            <div className="text-xs text-green-200 mt-1">セーブデータを よみこむ</div>
                        </button>
                    )}
                    <a href="index.html"
                        className="bg-slate-600 hover:bg-slate-500 text-white px-8 py-3 rounded-2xl font-bold text-center transition-all border-4 border-slate-500 hover:border-yellow-400">
                        クラシックバトル
                        <div className="text-xs text-slate-300 mt-1">���トルだけ たのしむ</div>
                    </a>
                </div>
            </div>
        );

        // ===== 御三家選択画面 =====
        const StarterSelect = ({ onSelect }) => {
            const starters = NPCs.professor_oak.starterPokemon;
            return (
                <div className="bg-slate-800 rounded-3xl border-4 border-slate-700 shadow-2xl text-white font-pixel p-6">
                    <h2 className="text-2xl text-center text-yellow-400 mb-2">ポケモンを えらぼう！</h2>
                    {NPCs.professor_oak.image && (
                        <div className="flex justify-center mb-3">
                            <img src={NPCs.professor_oak.image} alt="オーキドはかせ"
                                className="w-36 h-36 object-contain"
                                style={{ imageRendering: 'pixelated', filter: 'drop-shadow(0 0 8px rgba(255,200,50,0.3))' }} />
                        </div>
                    )}
                    <p className="text-slate-400 text-sm text-center mb-6">オーキドはかせから 1びきの ポケモンを もらえるぞ</p>
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                        {starters.map(key => {
                            const data = POKEMON_DATA[key];
                            return (
                                <button key={key} onClick={() => onSelect(key)}
                                    className="bg-slate-700 hover:bg-slate-600 border-4 border-transparent hover:border-yellow-400 p-4 rounded-2xl transition-all flex flex-col items-center">
                                    <img src={getPokemonImageUrl(key)} className="w-24 h-24" />
                                    <span className="text-lg mt-2">{data.name}</span>
                                    <span className="text-xs text-slate-400">{TYPE_NAME_JP[data.type]}タイプ</span>
                                </button>
                            );
                        })}
                    </div>
                </div>
            );
        };

        // ===== ワールドマップ =====
        const WorldMap = ({ progress, badges, onSelectTown, onOpenParty, onOpenBag, onReport }) => {
            const allBadgeIds = Object.values(GymLeaders).map(g => g.badge);
            const hasAllBadges = allBadgeIds.every(b => badges.includes(b));

            return (
                <div className="bg-slate-800 rounded-3xl border-4 border-slate-700 shadow-2xl text-white font-pixel p-4 md:p-6 max-h-[90vh] overflow-hidden flex flex-col">
                    <div className="flex justify-between items-center mb-3 flex-shrink-0">
                        <h2 className="text-2xl text-yellow-400">ワールドマップ</h2>
                        <div className="flex gap-2">
                            <button onClick={onOpenParty} className="bg-blue-700 hover:bg-blue-600 px-3 py-1 rounded-lg text-sm border border-blue-500">てもち</button>
                            <button onClick={onOpenBag} className="bg-green-700 hover:bg-green-600 px-3 py-1 rounded-lg text-sm border border-green-500">バッグ</button>
                            <button onClick={onReport} className="bg-yellow-700 hover:bg-yellow-600 px-3 py-1 rounded-lg text-sm border border-yellow-500">レポート</button>
                        </div>
                    </div>
                    {/* 進行ガイド */}
                    <div className="bg-slate-900 rounded-xl p-3 mb-3 flex-shrink-0 border border-slate-700">
                        <div className="text-xs text-yellow-400 mb-1">💡 ジムリーダーに かって バッジを あつめよう！</div>
                        <div className="text-xs text-slate-400">バッジが ないと つぎの まちに すすめません</div>
                    </div>
                    {/* バッジ一覧 */}
                    <div className="flex items-center gap-1.5 mb-3 flex-shrink-0 flex-wrap">
                        {Object.values(GymLeaders).map(gym => (
                            <div key={gym.badge}
                                className={`flex items-center gap-1 px-2 py-0.5 rounded-lg text-xs ${badges.includes(gym.badge) ? 'bg-yellow-900/50 border border-yellow-600' : 'bg-slate-900 border border-slate-700 opacity-40'}`}>
                                <span>🏅</span>
                                <span>{gym.badgeName}</span>
                            </div>
                        ))}
                    </div>
                    <div className="world-map-grid overflow-y-auto flex-1 scrollable">
                        {Object.entries(Towns).map(([townId, town]) => {
                            let isUnlocked = true;
                            if (town.unlockedBy === 'all_badges') {
                                isUnlocked = hasAllBadges;
                            } else if (town.unlockedBy) {
                                isUnlocked = badges.includes(town.unlockedBy);
                            }
                            const gym = town.hasGym ? GymLeaders[town.gymId] : null;
                            const gymCleared = gym ? badges.includes(gym.badge) : false;
                            return (
                                <button key={townId}
                                    onClick={() => isUnlocked && onSelectTown(townId)}
                                    disabled={!isUnlocked}
                                    className={`p-3 rounded-2xl border-4 transition-all text-left ${isUnlocked
                                        ? 'bg-slate-700 hover:bg-slate-600 border-slate-500 hover:border-yellow-400 cursor-pointer'
                                        : 'bg-slate-900 border-slate-800 opacity-40 cursor-not-allowed'}`}>
                                    <div className="flex items-center gap-2 mb-1">
                                        <span className="text-xl">{town.icon}</span>
                                        <span className="font-bold text-sm">{town.name}</span>
                                    </div>
                                    <div className="text-xs text-slate-400">{town.description}</div>
                                    {gym && (
                                        <div className={`mt-2 p-1.5 rounded-lg text-xs ${gymCleared ? 'bg-green-900/40 border border-green-700' : 'bg-red-900/40 border border-red-700'}`}>
                                            <div className="flex items-center gap-1">
                                                <span>{gymCleared ? '✅' : '⭐'}</span>
                                                <span className="font-bold">{gym.leader.name}</span>
                                            </div>
                                            <div className="text-slate-400 mt-0.5">{gym.leader.title}</div>
                                            {gymCleared && <div className="text-green-400">クリア済</div>}
                                            {!gymCleared && isUnlocked && <div className="text-yellow-400">ちょうせん できます！</div>}
                                        </div>
                                    )}
                                    {!isUnlocked && (
                                        <div className="text-xs text-red-400 mt-2 flex items-center gap-1">
                                            <span>🔒</span>
                                            <span>まえの ジムリーダーに かとう！</span>
                                        </div>
                                    )}
                                </button>
                            );
                        })}
                    </div>
                </div>
            );
        };

        // ===== 方向パッドボタン（長押し連続移動対応） =====
        const DPadButton = ({ label, onPress }) => {
            const intervalRef = useRef(null);
            const start = (e) => {
                e.preventDefault();
                onPress();
                intervalRef.current = setInterval(onPress, 180);
            };
            const stop = (e) => {
                e?.preventDefault();
                if (intervalRef.current) { clearInterval(intervalRef.current); intervalRef.current = null; }
            };
            useEffect(() => () => stop(), []);
            return (
                <button
                    onMouseDown={start} onMouseUp={stop} onMouseLeave={stop}
                    onTouchStart={start} onTouchEnd={stop} onTouchCancel={stop}
                    className="bg-slate-700 hover:bg-slate-600 active:bg-slate-500 rounded-lg p-2.5 text-center text-white text-lg select-none touch-none">
                    {label}
                </button>
            );
        };

        // ===== RPGマップ画面（町・ルート統合） =====
        const RPGMapScreen = ({ mapId, playerPos, setPlayerPos, progress, badges, onEncounter, onTrainerBattle, onGym, onShop, onPokecenter, onMapChange, onInteraction, onOpenParty, interactionMessage }) => {
            const canvasRef = useRef(null);
            const mapData = window.Game.Data.Maps[mapId];
            const MR = window.Game.MapRenderer;
            const [playerDir, setPlayerDir] = useState(0); // 0=down,1=left,2=right,3=up
            const [animFrame, setAnimFrame] = useState(0);
            const [isMoving, setIsMoving] = useState(false);
            const [dialogText, setDialogText] = useState(null);
            const [encounterFlash, setEncounterFlash] = useState(false);
            const moveQueue = useRef([]);
            const defeatedTrainers = progress?.defeatedTrainers || [];

            // タイルが歩けるか判定
            const canWalk = (x, y) => {
                if (!mapData) return false;
                if (x < 0 || x >= mapData.width || y < 0 || y >= mapData.height) return false;
                const tile = mapData.tiles[y * mapData.width + x];
                if (!window.Game.WALKABLE_TILES.includes(tile)) return false;
                // NPC・未撃破トレーナーの位置は歩けない
                if (mapData.interactions) {
                    const npcHere = mapData.interactions.find(i => i.x === x && i.y === y && (
                        (i.type === 'npc') ||
                        (i.type === 'trainer' && !defeatedTrainers.includes(i.action))
                    ));
                    if (npcHere) return false;
                }
                return true;
            };

            // 移動処理
            const tryMove = useCallback((dx, dy, dir) => {
                if (isMoving || dialogText) return;
                setPlayerDir(dir);
                const newX = playerPos.x + dx;
                const newY = playerPos.y + dy;

                // 出口チェック
                const exit = mapData?.exits?.find(e => e.x === newX && e.y === newY);
                if (exit) {
                    onMapChange(exit.to, { x: exit.entryX, y: exit.entryY });
                    return;
                }

                if (!canWalk(newX, newY)) return;

                setIsMoving(true);
                setAnimFrame(prev => prev + 1);
                setPlayerPos({ x: newX, y: newY });

                // ドアに入った時の自動インタラクション
                const tile = mapData.tiles[newY * mapData.width + newX];
                if (tile === 6 && mapData.interactions) {
                    const doorInter = mapData.interactions.find(i => i.x === newX && i.y === newY);
                    if (doorInter) {
                        setTimeout(() => handleInteraction(doorInter), 200);
                    }
                }

                // 草むらエンカウントチェック
                if (tile === 1 && mapData.encounters) {
                    const routeData = Routes[mapData.encounters];
                    if (routeData && Encounter.checkEncounter(routeData.type || 'grass')) {
                        const wildPokemon = Encounter.generateWildPokemon(routeData.encounters);
                        if (wildPokemon) {
                            setEncounterFlash(true);
                            setTimeout(() => {
                                setEncounterFlash(false);
                                onEncounter(wildPokemon);
                            }, 500);
                            return;
                        }
                    }
                }

                setTimeout(() => setIsMoving(false), 150);
            }, [playerPos, isMoving, dialogText, mapData]);

            // インタラクション（Aボタン / タップ）
            const tryInteract = useCallback(() => {
                if (dialogText) { setDialogText(null); return; }
                if (!mapData?.interactions) return;

                // 向いている方向の1マス先をチェック
                const dirs = [[0, 1], [-1, 0], [1, 0], [0, -1]]; // down,left,right,up
                const [dx, dy] = dirs[playerDir];
                const tx = playerPos.x + dx;
                const ty = playerPos.y + dy;

                const inter = mapData.interactions.find(i => i.x === tx && i.y === ty);
                if (!inter) {
                    // 自分の位置もチェック
                    const selfInter = mapData.interactions.find(i => i.x === playerPos.x && i.y === playerPos.y);
                    if (selfInter) handleInteraction(selfInter);
                    return;
                }
                handleInteraction(inter);
            }, [playerPos, playerDir, dialogText, mapData]);

            const handleInteraction = (inter) => {
                switch (inter.type) {
                    case 'sign':
                        setDialogText(inter.message);
                        break;
                    case 'npc':
                        if (inter.action === 'professor_oak') {
                            onInteraction?.('professor_oak');
                        } else {
                            setDialogText(inter.label || 'はなしかけた');
                        }
                        break;
                    case 'trainer':
                        if (!defeatedTrainers.includes(inter.action)) {
                            const trainer = Trainers[inter.action];
                            if (trainer) {
                                setDialogText(trainer.dialogue?.before || 'しょうぶだ！');
                                setTimeout(() => {
                                    setDialogText(null);
                                    onTrainerBattle(inter.action);
                                }, 1500);
                            }
                        } else {
                            setDialogText('もう たたかった トレーナーだ');
                        }
                        break;
                    case 'door':
                        if (inter.action === 'oak_lab') {
                            onInteraction?.('oak_lab');
                        } else {
                            setDialogText(inter.label || 'ドアだ');
                        }
                        break;
                    case 'pokecenter':
                        onPokecenter?.();
                        break;
                    case 'shop':
                        onShop?.(inter.action);
                        break;
                    case 'gym':
                        onGym?.(inter.action);
                        break;
                }
            };

            // タッチ操作: 長押しで押してる場所に向かって素早く連続移動、タップではなす
            const touchRef = useRef({ active: false, tileX: 0, tileY: 0, startTime: 0, startX: 0, startY: 0 });
            const walkTimerRef = useRef(null);

            // タッチ座標→マップタイル座標変換
            const touchToTile = (touchX, touchY) => {
                const canvas = canvasRef.current;
                if (!canvas) return null;
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const canvasX = (touchX - rect.left) * scaleX;
                const canvasY = (touchY - rect.top) * scaleY;
                const ts = MR.TILE_SIZE;
                const camX = playerPos.x * ts - canvas.width / 2 + ts / 2;
                const camY = playerPos.y * ts - canvas.height / 2 + ts / 2;
                return {
                    x: Math.floor((canvasX + camX) / ts),
                    y: Math.floor((canvasY + camY) / ts)
                };
            };

            // 目標タイルに向かって1歩進む
            const stepToward = useCallback((goalX, goalY) => {
                const dx = goalX - playerPos.x;
                const dy = goalY - playerPos.y;
                if (dx === 0 && dy === 0) return false;
                // 距離が大きい軸を優先
                if (Math.abs(dx) >= Math.abs(dy)) {
                    if (dx > 0) { tryMove(1, 0, 2); return true; }
                    else { tryMove(-1, 0, 1); return true; }
                } else {
                    if (dy > 0) { tryMove(0, 1, 0); return true; }
                    else { tryMove(0, -1, 3); return true; }
                }
            }, [playerPos, tryMove]);

            // 長押し中の連続移動ループ
            useEffect(() => {
                if (walkTimerRef.current) { clearInterval(walkTimerRef.current); walkTimerRef.current = null; }
                if (!touchRef.current.active) return;

                const tick = () => {
                    if (!touchRef.current.active) return;
                    stepToward(touchRef.current.tileX, touchRef.current.tileY);
                };
                tick(); // 即座に1歩
                walkTimerRef.current = setInterval(tick, 120);
                return () => { if (walkTimerRef.current) { clearInterval(walkTimerRef.current); walkTimerRef.current = null; } };
            }, [touchRef.current.active, touchRef.current.tileX, touchRef.current.tileY, stepToward]);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;

                const onStart = (e) => {
                    e.preventDefault();
                    const t = e.touches[0];
                    touchRef.current = { active: false, tileX: 0, tileY: 0, startTime: Date.now(), startX: t.clientX, startY: t.clientY };
                    // 300ms後にまだ押してたら長押し開始
                    touchRef.current._holdTimer = setTimeout(() => {
                        const tile = touchToTile(t.clientX, t.clientY);
                        if (tile) {
                            touchRef.current.active = true;
                            touchRef.current.tileX = tile.x;
                            touchRef.current.tileY = tile.y;
                            // stateトリガー用に強制更新
                            setAnimFrame(f => f + 0.001);
                        }
                    }, 250);
                };

                const onMove = (e) => {
                    e.preventDefault();
                    if (!touchRef.current.active) return;
                    // 押してる場所が変わったら目的地更新
                    const t = e.touches[0];
                    const tile = touchToTile(t.clientX, t.clientY);
                    if (tile && (tile.x !== touchRef.current.tileX || tile.y !== touchRef.current.tileY)) {
                        touchRef.current.tileX = tile.x;
                        touchRef.current.tileY = tile.y;
                    }
                };

                const onEnd = (e) => {
                    e.preventDefault();
                    if (touchRef.current._holdTimer) clearTimeout(touchRef.current._holdTimer);
                    const wasActive = touchRef.current.active;
                    touchRef.current.active = false;
                    if (walkTimerRef.current) { clearInterval(walkTimerRef.current); walkTimerRef.current = null; }

                    if (!wasActive) {
                        // 長押しでなかった → タップ = はなす
                        const elapsed = Date.now() - touchRef.current.startTime;
                        if (elapsed < 300) {
                            tryInteract();
                        }
                    }
                };

                canvas.addEventListener('touchstart', onStart, { passive: false });
                canvas.addEventListener('touchmove', onMove, { passive: false });
                canvas.addEventListener('touchend', onEnd, { passive: false });
                canvas.addEventListener('touchcancel', onEnd, { passive: false });
                return () => {
                    canvas.removeEventListener('touchstart', onStart);
                    canvas.removeEventListener('touchmove', onMove);
                    canvas.removeEventListener('touchend', onEnd);
                    canvas.removeEventListener('touchcancel', onEnd);
                };
            }, [tryMove, tryInteract, playerPos]);

            // キーボード入力
            useEffect(() => {
                const handleKey = (e) => {
                    switch (e.key) {

        // ===== バッグ画面 =====
        const BagScreen = ({ items, onUseItem, onBack }) => (

        // ===== ポケモンセンター =====
        const PokecenterScreen = ({ onHeal, onBack, healed }) => (
